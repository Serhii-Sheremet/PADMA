name: Build project snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create project snapshot
        run: |
          echo "# Project Snapshot" > PROJECT_SNAPSHOT.md
          echo "" >> PROJECT_SNAPSHOT.md
          echo "Автоматически сгенерировано $(date)" >> PROJECT_SNAPSHOT.md
          echo "" >> PROJECT_SNAPSHOT.md

          # Собираем все нужные файлы
          find . -type f \( -name "*.cs" -o -name "*.xaml" -o -name "*.csproj" -o -name "*.sln" \) | sort | while read file; do
            echo "## $file" >> PROJECT_SNAPSHOT.md
            echo '```' >> PROJECT_SNAPSHOT.md
            cat "$file" >> PROJECT_SNAPSHOT.md
            echo '```' >> PROJECT_SNAPSHOT.md
            echo "" >> PROJECT_SNAPSHOT.md
          done

      - name: Commit snapshot
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add PROJECT_SNAPSHOT.md
          git commit -m "Update project snapshot [skip ci]" || echo "No changes to commit"
          git push
